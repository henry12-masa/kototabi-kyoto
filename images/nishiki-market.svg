<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="g10" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#ffe4c0"/>
<stop offset="100%" stop-color="#c99a1e"/>
</linearGradient>
</defs>
<rect width="400" height="300" fill="url(#g10)"/>
<!-- covered arcade roof -->
<rect y="60" width="400" height="20" fill="#3a2a1f"/>
<g fill="#6e2418">
<polygon points="0,80 60,80 30,60"/>
<polygon points="60,80 120,80 90,60"/>
<polygon points="120,80 180,80 150,60"/>
<polygon points="180,80 240,80 210,60"/>
<polygon points="240,80 300,80 270,60"/>
<polygon points="300,80 360,80 330,60"/>
<polygon points="360,80 400,80 380,60"/>
</g>
<!-- shop stalls -->
<rect x="0" y="150" width="400" height="90" fill="#8a5a3a"/>
<g fill="#a5673f">
<rect x="10" y="160" width="60" height="70"/>
<rect x="90" y="160" width="60" height="70"/>
<rect x="170" y="160" width="60" height="70"/>
<rect x="250" y="160" width="60" height="70"/>
<rect x="330" y="160" width="60" height="70"/>
</g>
<!-- awnings -->
<g fill="#c1401f">
<rect x="10" y="150" width="60" height="10"/>
<rect x="90" y="150" width="60" height="10"/>
<rect x="170" y="150" width="60" height="10"/>
<rect x="250" y="150" width="60" height="10"/>
<rect x="330" y="150" width="60" height="10"/>
</g>
<!-- lanterns -->
<circle cx="40" cy="100" r="8" fill="#e0824a"/>
<circle cx="200" cy="100" r="8" fill="#e0824a"/>
<circle cx="360" cy="100" r="8" fill="#e0824a"/>
</svg>
